name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'src/main.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'CNAME'
      - 'favicon.svg'
      - 'og-image.svg'
      - 'site.webmanifest'
      - 'public/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
